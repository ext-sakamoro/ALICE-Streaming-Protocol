name: 'ALICE-Streaming-Protocol Optional Bridge Stubs'
description: |
  Create empty stub crates for the libasp (ALICE-Streaming-Protocol) sibling
  path deps (alice-codec / alice-voice / alice-sync / alice-physics /
  alice-crypto) so that libasp can resolve its workspace-relative path deps
  in CI.
  These crates are private to the local ALICE Eco-System and not on crates.io.

  Each stub carries `license = "MIT OR Apache-2.0"` (canonical CI template
  trap #2 — cargo-deny rejects unlicensed stubs).

  Canonical CI template: [[reference_alice_ci_canonical_template]]

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        for entry in \
            ALICE-Codec:alice-codec \
            ALICE-Voice:alice-voice \
            ALICE-Sync:alice-sync \
            ALICE-Physics:alice-physics \
            ALICE-Crypto:alice-crypto; do
          dir="${entry%:*}"
          crate="${entry#*:}"
          mkdir -p "../${dir}/src"
          cat > "../${dir}/Cargo.toml" <<TOML
        [package]
        name = "${crate}"
        version = "0.1.0"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [features]
        default = []
        std = []

        [lib]
        path = "src/lib.rs"
        TOML
          : > "../${dir}/src/lib.rs"
        done
        echo "Created stubs: alice-codec / alice-voice / alice-sync / alice-physics / alice-crypto (all with license = MIT OR Apache-2.0, std feature)"

[package]
name = "libasp"
version = "1.1.0"
edition = "2021"
resolver = "3"
# Verified by the CI `msrv` job (`cargo +1.87 check`, alice-codec / alice-zip require 1.87)
rust-version = "1.87"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "ALICE Streaming Protocol - High-performance video streaming codec"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ext-sakamoro/ALICE-Streaming-Protocol"
keywords = ["streaming", "video", "codec", "alice", "procedural"]
categories = ["multimedia::video", "compression"]

# (default lib target: an explicit `crate-type = ["rlib"]` makes the target kind
# "rlib", which cargo-mutants skips — mutants --list returned 0)
[lib]
name = "libasp"

[features]
default = []
python = ["pyo3", "numpy"]
wasm = ["wasm-bindgen", "js-sys", "web-sys"]
simd = []
bincode-compat = ["dep:bincode"]  # Legacy Rust-only serialization
codec = ["dep:alice-codec"]       # ALICE-Codec (wavelet + rANS) integration
# voice feature は alice-voice 未 publish のため 1.0.0 で一時 disable
# voice = ["dep:alice-voice"]       # ALICE-Voice (LPC parametric) integration
media-stack = ["codec"]  # A/V media pipeline (voice 一時除外、alice-voice publish 後 1.1 で復活予定)
sync = ["dep:alice-sync"]         # ALICE-Sync events embedded in ASP packets
physics = ["dep:alice-physics"]   # Physics state delta → D-packets
crypto = ["dep:alice-crypto"]    # ALICE-Crypto AEAD encryption for ASP packets
all-bridges = ["sync", "physics", "crypto"]  # All integration bridges

[dependencies]
# Serialization - FlatBuffers (required, cross-language, zero-copy)
flatbuffers = "24.3"

# Serialization - bincode (optional, Rust-only legacy support)
bincode = { version = "1.3", optional = true }

# Serialization - Common
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
base64 = "0.22"

# Numerical computation
ndarray = { version = "0.16", features = ["serde", "rayon"] }
num-traits = "0.2"
num-complex = "0.4"

# Parallel processing
rayon = "1.10"

# SIMD operations
wide = "0.7"

# Zero-copy casting
bytemuck = { version = "1.14", features = ["derive"] }

# Python bindings (optional) - version matched with ALICE-Zip
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
numpy = { version = "0.29", optional = true }

# WebAssembly (optional)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console"] }

# ALICE Media Stack (optional) — crates.io versions (the CI sibling stubs were
# versioned 0.1.0 and could not satisfy `alice-physics = "1"`, canonical trap #45)
alice-codec = { version = "0.1", optional = true, default-features = false, features = ["std"] }
# alice-voice 一時 disable (crates.io 未 publish、user 保留、1.1 で復活予定)
# alice-voice = { path = "../ALICE-Voice", version = "0.1", optional = true, default-features = false, features = ["std"] }
alice-sync = { version = "0.6", optional = true, default-features = false, features = ["std"] }
alice-physics = { version = "1", optional = true, default-features = false, features = ["std"] }
alice-crypto = { version = "0.1", optional = true, default-features = false, features = ["std"] }

# Error handling
thiserror = "2.0"

# Logging
log = "0.4"

# `voice` is a planned feature (alice-voice not yet on crates.io, 1.1); the
# `cfg(feature = "voice")` gates stay in the source, so tell rustc the value is
# expected instead of getting unexpected_cfgs on every build
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("voice"))'] }

[package.metadata.docs.rs]
features = ["simd", "media-stack", "sync", "physics", "crypto", "bincode-compat"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"

[[bench]]
name = "motion_estimation"
harness = false

[[bench]]
name = "perf_claims"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# `panic = "unwind"` (default) on purpose: the `python` feature (PyO3) converts a
# Rust panic into a Python `PanicException` by catching the unwind at the FFI
# boundary; with `panic = "abort"` a bad NumPy shape would take the whole
# interpreter down instead of raising
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

# canonical CI template [[reference_alice_ci_canonical_template]] 罠 #3:
# cargo-machete false-positive を明示除外
# - log / base64 / num-complex: 現状 src/ で未使用だが公開 API / 将来 feature 用に残置
# - serde_bytes: serde derive 経由の binary field 用 (macro 展開経由で使用)
# - wide: simd feature で使用 (feature-gated) — canonical trap #3
# - bytemuck: zero-copy cast helper、feature-gated / 一部 module で macro 経由使用
# - ndarray: numpy 経由の array 型として使用 (python feature)
# - num-traits: 数値抽象 trait、将来 feature 用
# - wasm-bindgen / js-sys / web-sys: wasm feature で使用 (feature-gated)
[package.metadata.cargo-machete]
ignored = [
    "log",
    "base64",
    "serde_bytes",
    "num-complex",
    "wide",
    "bytemuck",
    "ndarray",
    "num-traits",
    "wasm-bindgen",
    "js-sys",
    "web-sys",
]
